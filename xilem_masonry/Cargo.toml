[package]
name = "xilem_masonry"
version.workspace = true
description = "Masonry backend for the Xilem Rust UI framework."
keywords = ["gui", "ui", "native", "gpu", "performance"]
categories = ["gui", "graphics", "internationalization", "accessibility"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
default = ["masonry/default", "tokio-rt"]
tokio-rt = ["dep:tokio"]
smol-rt = ["dep:smol"]

[dependencies]
xilem_core.workspace = true
masonry.workspace = true
smallvec.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
usvg.workspace = true

[lints]
workspace = true
